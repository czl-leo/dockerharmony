name: ArkTS unit test

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

concurrency:
  group: arkts-unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download OpenHarmony command line tools
        run: |
          set -eux
          curl -fL --retry 3 -o clt.tar.xz \
            https://github.com/SwimmingTiger/command-line-tools/releases/download/ohos-arm64-26.0.0.621-26.0.0.18/command-line-tools-ohos-arm64-26.0.0.621-26.0.0.18.tar.xz
          mkdir -p clt
          tar -xJf clt.tar.xz -C clt
          rm -f clt.tar.xz
          find clt -maxdepth 2 -type d -name command-line-tools -printf '%p\n'

      - name: Run ArkTS unit tests in dockerharmony
        run: |
          set -eux
          tool=$(find clt -maxdepth 2 -type d -name command-line-tools | head -n 1)
          test -n "$tool"
          es2abc=$(find "$tool" -path '*/ark/build/bin/es2abc' -type f | head -n 1)
          test -n "$es2abc"
          echo "es2abc=$es2abc"
          readelf -d "$es2abc"
          mkdir -p stub
          real=$(find "$tool" -name 'libhilog.so' -type f | head -n 1 || true)
          if [ -n "$real" ]; then
            cp -a "$real" stub/libhilog.so
            echo "using $real"
          else
            # This image disables HiLog (disable-hilog.patch) because there is no
            # HiLog service. es2abc still needs the library, so provide a no-op one.
            # -nostdlib keeps the stub free of glibc, so musl can load it.
            readelf -Ws "$es2abc" | awk '/ UND / {print $NF}' | sed 's/@.*//' | grep -E 'HiLog|OH_LOG|hilog' | sort -u > stub/syms.txt || true
            if [ ! -s stub/syms.txt ]; then
              echo HiLogPrint > stub/syms.txt
            fi
            cat stub/syms.txt
            {
              echo 'int __attribute__((visibility("default"))) __dummy_keep(void){return 0;}'
              while read -r sym; do
                [ -n "$sym" ] || continue
                echo "int ${sym}(void){return 0;}"
              done < stub/syms.txt
            } > stub/hilog.c
            gcc -shared -fPIC -nostdlib -Wl,-soname,libhilog.so -o stub/libhilog.so stub/hilog.c
            readelf -d stub/libhilog.so
          fi
          # Previewer in this package is an x86_64 glibc binary. Run it with
          # qemu-user inside the arm64 image, against a staged glibc sysroot.
          sudo apt-get update
          sudo apt-get install -y qemu-user-static xvfb x11-xserver-utils
          qemu=$(command -v qemu-x86_64-static)
          test -n "$qemu"
          cp -a "$qemu" "$PWD/qemu-x86_64-static"
          chmod +x "$PWD/qemu-x86_64-static"
          Xvfb :99 -screen 0 1080x1920x24 >/tmp/xvfb.log 2>&1 &
          sleep 1
          DISPLAY=:99 xhost +
          rm -rf x64root
          docker run --rm --platform linux/amd64 \
            -v "$PWD/x64root:/out" \
            ubuntu:24.04 \
            bash -c 'set -eux
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                libc6 libstdc++6 libgcc-s1 zlib1g libexpat1 \
                libx11-6 libxext6 libxrender1 libxi6 libxrandr2 libxfixes3 \
                libxcursor1 libxinerama1 libxcb1 libxkbcommon0 \
                libgl1 libegl1 libglib2.0-0 libfontconfig1 libfreetype6 \
                libnss3 libdrm2 libgbm1 libasound2t64 libpng16-16 libdbus-1-3 \
                ca-certificates
              mkdir -p /out/lib/x86_64-linux-gnu /out/lib64 /out/usr/lib/x86_64-linux-gnu
              cp -a /lib/x86_64-linux-gnu/. /out/lib/x86_64-linux-gnu/
              if [ -d /usr/lib/x86_64-linux-gnu ]; then
                cp -a /usr/lib/x86_64-linux-gnu/. /out/usr/lib/x86_64-linux-gnu/
              fi
              if [ -e /lib64/ld-linux-x86-64.so.2 ]; then
                cp -a /lib64/ld-linux-x86-64.so.2 /out/lib64/
              else
                cp -a /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /out/lib64/ld-linux-x86-64.so.2
              fi
            '
          node scripts/patch-hvigor-local-test.mjs "$tool"
          docker pull hqzing/dockerharmony:latest
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD:/work" \
            -v /tmp/.X11-unix:/tmp/.X11-unix \
            -w /work \
            -e DISPLAY=:99 \
            -e TOOL_HOME="/work/$tool" \
            -e DEVECO_SDK_HOME="/work/$tool/sdk" \
            -e NODE_HOME="/work/$tool/tool/node" \
            -e SSL_CERT_FILE=/etc/ssl/certs/cacert.pem \
            hqzing/dockerharmony:latest \
            /bin/sh -c '
              set -eu
              export PATH="$NODE_HOME/bin:$TOOL_HOME/bin:$PATH"
              arkbin=$TOOL_HOME/sdk/default/openharmony/ets/build-tools/ets-loader/bin/ark/build/bin
              export LD_LIBRARY_PATH="/work/stub:$arkbin:$TOOL_HOME/sdk/default/openharmony/toolchains/lib:${LD_LIBRARY_PATH:-}"
              test -f /work/stub/libhilog.so
              js=$TOOL_HOME/bin/hvigorw.js
              if [ ! -f "$js" ]; then js=$TOOL_HOME/hvigor/bin/hvigorw.js; fi
              pm=$TOOL_HOME/ohpm/bin/pm-cli.js
              test -f "$js"
              test -f "$pm"
              test -x "$NODE_HOME/bin/node"
              mkdir -p /tmp/ohos-bin
              printf "%s\n" "#!/bin/sh" "exec \"$NODE_HOME/bin/node\" -- \"$js\" \"\$@\"" > /tmp/ohos-bin/hvigorw
              printf "%s\n" "#!/bin/sh" "exec \"$NODE_HOME/bin/node\" --no-deprecation \"$pm\" \"\$@\"" > /tmp/ohos-bin/ohpm
              chmod +x /tmp/ohos-bin/hvigorw /tmp/ohos-bin/ohpm
              export PATH="/tmp/ohos-bin:$PATH"
              echo "::notice::node $($NODE_HOME/bin/node -v)"
              echo "::notice::hvigor $(command -v hvigorw)"
              echo "::notice::ohpm $(command -v ohpm)"
              printf "%s\n" "#!/bin/sh" "exit 0" > /tmp/ohos-bin/lsof
              chmod +x /tmp/ohos-bin/lsof
              prev=$TOOL_HOME/sdk/default/openharmony/previewer/common/bin/Previewer
              if [ -f "$prev" ] && [ ! -f "$prev.bin" ]; then
                mv "$prev" "$prev.bin"
              fi
              if [ -f "$prev.bin" ]; then
                chmod +x "$prev.bin"
                test -x /work/qemu-x86_64-static
                "$NODE_HOME/bin/node" -e "const fs=require(\"fs\"); const b=fs.readFileSync(process.argv[1]); console.log(\"::notice::Previewer elf_machine=\"+b.readUInt16LE(18)+\" bytes=\"+b.length)" "$prev.bin"
                printf "%s\n" "#!/bin/sh" \
                  "dir=\$(CDPATH= cd -- \"\$(dirname \"\$0\")\" && pwd)" \
                  "export LIBGL_ALWAYS_SOFTWARE=1" \
                  "export QT_QPA_PLATFORM=offscreen" \
                  "export LD_LIBRARY_PATH=\"\$dir:/work/x64root/lib/x86_64-linux-gnu:/work/x64root/usr/lib/x86_64-linux-gnu\"" \
                  "exec /work/qemu-x86_64-static -L /work/x64root \"\$dir/Previewer.bin\" \"\$@\"" > "$prev"
                chmod +x "$prev"
              else
                echo "::notice::Previewer missing"
              fi
              cd /work/ohos-har
              ohpm config set registry https://ohpm.openharmony.cn/ohpm/
              ohpm config set strict_ssl false
              ohpm install --all
              set +e
              hvigorw test -p module=oss_v2 -p coverage=false --no-daemon
              code=$?
              set -e
              if [ -f /work/previewer.log ]; then
                echo "----- previewer.log -----"
                cat /work/previewer.log
              fi
              exit "$code"
            '

      - name: Publish test log
        if: always()
        run: |
          result=ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
          if [ -f "$result" ]; then
            echo "## ArkTS unit tests" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$result" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arkts-unit-test
          path: |
            ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
            ohos-har/oss-v2/.test/default/outputs/test/reports/
          if-no-files-found: warn
