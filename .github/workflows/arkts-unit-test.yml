name: ArkTS unit test

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download OpenHarmony command line tools
        run: |
          set -eux
          curl -fL --retry 3 -o clt.tar.xz \
            https://github.com/SwimmingTiger/command-line-tools/releases/download/ohos-arm64-26.0.0.621-26.0.0.18/command-line-tools-ohos-arm64-26.0.0.621-26.0.0.18.tar.xz
          mkdir -p clt
          tar -xJf clt.tar.xz -C clt
          rm -f clt.tar.xz
          find clt -maxdepth 2 -type d -name command-line-tools -printf '%p\n'

      - name: Run ArkTS unit tests in dockerharmony
        run: |
          set -eux
          tool=$(find clt -maxdepth 2 -type d -name command-line-tools | head -n 1)
          test -n "$tool"
          es2abc=$(find "$tool" -path '*/ark/build/bin/es2abc' -type f | head -n 1)
          test -n "$es2abc"
          echo "es2abc=$es2abc"
          readelf -d "$es2abc"
          mkdir -p stub
          real=$(find "$tool" -name 'libhilog.so' -type f | head -n 1 || true)
          if [ -n "$real" ]; then
            cp -a "$real" stub/libhilog.so
            echo "using $real"
          else
            # This image disables HiLog (disable-hilog.patch) because there is no
            # HiLog service. es2abc still needs the library, so provide a no-op one.
            # -nostdlib keeps the stub free of glibc, so musl can load it.
            readelf -Ws "$es2abc" | awk '/ UND / {print $NF}' | sed 's/@.*//' | grep -E 'HiLog|OH_LOG|hilog' | sort -u > stub/syms.txt || true
            if [ ! -s stub/syms.txt ]; then
              echo HiLogPrint > stub/syms.txt
            fi
            cat stub/syms.txt
            {
              echo 'int __attribute__((visibility("default"))) __dummy_keep(void){return 0;}'
              while read -r sym; do
                [ -n "$sym" ] || continue
                echo "int ${sym}(void){return 0;}"
              done < stub/syms.txt
            } > stub/hilog.c
            gcc -shared -fPIC -nostdlib -Wl,-soname,libhilog.so -o stub/libhilog.so stub/hilog.c
            readelf -d stub/libhilog.so
          fi
          prevjs=$(find "$tool" -path '*localTest/previewer.js' -type f | head -n 1 || true)
          if [ -n "$prevjs" ]; then
            # Windows appends Previewer.exe. Other platforms should append Previewer.
            # OpenHarmony node does not report platform linux, so the directory was spawned.
            PREVJS="$prevjs" node -e '
              const fs = require("fs");
              const p = process.env.PREVJS;
              const s = fs.readFileSync(p, "utf8");
              const old = "else if (process.platform === '\''darwin'\'' || process.platform === '\''linux'\'')";
              if (!s.includes(old)) {
                console.log("previewer.js has no platform check");
                process.exit(0);
              }
              fs.writeFileSync(p, s.replace(old, "else if (process.platform !== '\''win32'\'')"));
              console.log("patched " + p);
            '
          fi
          docker pull hqzing/dockerharmony:latest
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e TOOL_HOME="/work/$tool" \
            -e DEVECO_SDK_HOME="/work/$tool/sdk" \
            -e NODE_HOME="/work/$tool/tool/node" \
            -e SSL_CERT_FILE=/etc/ssl/certs/cacert.pem \
            hqzing/dockerharmony:latest \
            /bin/sh -c '
              set -eu
              export PATH="$NODE_HOME/bin:$TOOL_HOME/bin:$PATH"
              arkbin=$TOOL_HOME/sdk/default/openharmony/ets/build-tools/ets-loader/bin/ark/build/bin
              export LD_LIBRARY_PATH="/work/stub:$arkbin:$TOOL_HOME/sdk/default/openharmony/toolchains/lib:${LD_LIBRARY_PATH:-}"
              test -f /work/stub/libhilog.so
              js=$TOOL_HOME/bin/hvigorw.js
              if [ ! -f "$js" ]; then js=$TOOL_HOME/hvigor/bin/hvigorw.js; fi
              pm=$TOOL_HOME/ohpm/bin/pm-cli.js
              test -f "$js"
              test -f "$pm"
              test -x "$NODE_HOME/bin/node"
              mkdir -p /tmp/ohos-bin
              printf "%s\n" "#!/bin/sh" "exec \"$NODE_HOME/bin/node\" -- \"$js\" \"\$@\"" > /tmp/ohos-bin/hvigorw
              printf "%s\n" "#!/bin/sh" "exec \"$NODE_HOME/bin/node\" --no-deprecation \"$pm\" \"\$@\"" > /tmp/ohos-bin/ohpm
              chmod +x /tmp/ohos-bin/hvigorw /tmp/ohos-bin/ohpm
              export PATH="/tmp/ohos-bin:$PATH"
              echo "::notice::node $($NODE_HOME/bin/node -v)"
              echo "::notice::hvigor $(command -v hvigorw)"
              echo "::notice::ohpm $(command -v ohpm)"
              prev=$TOOL_HOME/sdk/default/openharmony/previewer/common/bin/Previewer
              if [ -f "$prev" ]; then
                chmod +x "$prev"
                "$NODE_HOME/bin/node" -e "const fs=require(\"fs\"); const b=fs.readFileSync(process.argv[1]); console.log(\"::notice::Previewer elf_machine=\"+b.readUInt16LE(18)+\" bytes=\"+b.length)" "$prev"
              else
                echo "::notice::Previewer missing"
              fi
              cd /work/ohos-har
              ohpm config set registry https://ohpm.openharmony.cn/ohpm/
              ohpm config set strict_ssl false
              ohpm install --all
              hvigorw test -p module=oss_v2 -p coverage=false --no-daemon
            '

      - name: Publish test log
        if: always()
        run: |
          result=ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
          if [ -f "$result" ]; then
            echo "## ArkTS unit tests" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$result" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arkts-unit-test
          path: |
            ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
            ohos-har/oss-v2/.test/default/outputs/test/reports/
          if-no-files-found: warn
