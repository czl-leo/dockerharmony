name: ArkTS unit test

on:
  push:
    branches: [ "try-image" ]
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Checkout OSS SDK
        uses: actions/checkout@v5
        with:
          repository: czl-leo/alibabacloud-oss-ts-sdk-v2
          ref: dev-harmony-ci
          path: oss-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        working-directory: oss-sdk
        run: npm install --no-package-lock

      - name: Stage the har
        working-directory: oss-sdk
        run: npm run stage:har

      - name: Download OpenHarmony command line tools
        run: |
          set -eux
          curl -fL --retry 3 -o clt.tar.xz \
            https://github.com/SwimmingTiger/command-line-tools/releases/download/ohos-arm64-26.0.0.621-26.0.0.18/command-line-tools-ohos-arm64-26.0.0.621-26.0.0.18.tar.xz
          mkdir -p clt
          tar -xJf clt.tar.xz -C clt
          rm -f clt.tar.xz
          find clt -maxdepth 2 -type d -name command-line-tools -printf '%p\n'

      - name: Run ArkTS unit tests in dockerharmony
        run: |
          set -eux
          tool=$(find clt -maxdepth 2 -type d -name command-line-tools | head -n 1)
          test -n "$tool"
          docker pull hqzing/dockerharmony:latest
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e TOOL_HOME="/work/$tool" \
            -e DEVECO_SDK_HOME="/work/$tool/sdk" \
            -e NODE_HOME="/work/$tool/tool/node" \
            -e SSL_CERT_FILE=/etc/ssl/certs/cacert.pem \
            hqzing/dockerharmony:latest \
            /bin/sh -c '
              set -eu
              export PATH="$NODE_HOME/bin:$TOOL_HOME/bin:$PATH"
              export LD_LIBRARY_PATH="$TOOL_HOME/sdk/default/openharmony/toolchains/lib:${LD_LIBRARY_PATH:-}"
              js=$TOOL_HOME/bin/hvigorw.js
              if [ ! -f "$js" ]; then js=$TOOL_HOME/hvigor/bin/hvigorw.js; fi
              pm=$TOOL_HOME/ohpm/bin/pm-cli.js
              test -f "$js"
              test -f "$pm"
              test -x "$NODE_HOME/bin/node"
              mkdir -p /tmp/ohos-bin
              printf "%s\n" "#!/bin/sh" "exec \"$NODE_HOME/bin/node\" -- \"$js\" \"\$@\"" > /tmp/ohos-bin/hvigorw
              printf "%s\n" "#!/bin/sh" "exec \"$NODE_HOME/bin/node\" --no-deprecation \"$pm\" \"\$@\"" > /tmp/ohos-bin/ohpm
              chmod +x /tmp/ohos-bin/hvigorw /tmp/ohos-bin/ohpm
              export PATH="/tmp/ohos-bin:$PATH"
              echo "::notice::node $($NODE_HOME/bin/node -v)"
              echo "::notice::hvigor $(command -v hvigorw)"
              echo "::notice::ohpm $(command -v ohpm)"
              prev=$TOOL_HOME/sdk/default/openharmony/previewer/common/bin/Previewer
              if [ -f "$prev" ]; then
                "$NODE_HOME/bin/node" -e "const fs=require(\"fs\"); const b=fs.readFileSync(process.argv[1]); console.log(\"::notice::Previewer elf_machine=\"+b.readUInt16LE(18)+\" bytes=\"+b.length)" "$prev"
              else
                echo "::notice::Previewer missing"
              fi
              cd /work/oss-sdk/ohos-har
              ohpm config set registry https://ohpm.openharmony.cn/ohpm/
              ohpm config set strict_ssl false
              ohpm install --all
              cd /work/oss-sdk
              "$NODE_HOME/bin/node" scripts/run-harmony-test.mjs
            '

      - name: Publish test log
        if: always()
        run: |
          result=oss-sdk/ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
          if [ -f "$result" ]; then
            echo "## ArkTS unit tests" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$result" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arkts-unit-test
          path: |
            oss-sdk/ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
            oss-sdk/ohos-har/oss-v2/.test/default/outputs/test/reports/
          if-no-files-found: warn
