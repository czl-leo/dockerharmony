name: Try image

on:
  push:
    branches: [ "dev" ]

jobs:
  smoke:
    name: docker run
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Pull and execute the published image
        run: |
          set -eux
          docker pull hqzing/dockerharmony:latest
          docker image inspect hqzing/dockerharmony:latest --format 'arch={{.Architecture}} os={{.Os}}'
          docker run --rm hqzing/dockerharmony:latest /bin/sh -c 'echo SHELL_OK; uname -a; id; command -v curl; command -v toybox'
          docker run --rm -e SSL_CERT_FILE=/etc/ssl/certs/cacert.pem hqzing/dockerharmony:latest /bin/sh -c 'curl -fsSL -o /tmp/example.html -w "http_code=%{http_code}\n" https://example.com'

  as-container:
    name: job container
    runs-on: ubuntu-24.04-arm
    container:
      image: hqzing/dockerharmony:latest
    defaults:
      run:
        shell: sh
    steps:
      - name: Run a step inside the image
        run: |
          echo SHELL_OK
          uname -a
          id
          command -v curl
